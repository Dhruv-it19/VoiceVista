[project]
name = "voicevista"
version = "0.1.0"
description = "Video Translation with Whisper Speech Recognition - Translate speech in videos to different languages with AI-powered summarization"
readme = "README.md"
authors = [
    { name = "Dhruvit Loliyaniya", email = "dhruvitloliyaniya@gmail.com" },
]
requires-python = ">=3.11"

dependencies = [
    "aiofiles>=25.1.0",
    "deep-translator>=1.11.4",
    "edge-tts>=7.2.8",
    "fastapi>=0.141.1",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "openai-whisper>=20250625",
    "python-multipart>=0.0.32",
    "sniffio>=1.3.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.52.4",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""